name: Automatic Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          VERSION=$(date +"%Y.%m.%d.%H%M%S")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ""
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: ".exe"
          - os: darwin
            arch: amd64
            # macos-13 is Intel based
            runner: macos-13
            ext: ""
          - os: darwin
            arch: arm64
            # macos-latest is Apple Silicon based
            runner: macos-latest
            ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - name: Build Application
        shell: bash
        run: |
          mkdir -p bin
          VERSION=${{ needs.setup.outputs.version }}
          LDFLAGS="-s -w -X 'github.com/sametcn99/golter/internal/version.Current=$VERSION'"
          export CGO_ENABLED=1
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="$LDFLAGS" -o bin/golter-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: golter-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/golter-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: Release v${{ needs.setup.outputs.version }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true