name: Automatic Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - name: Generate Version Number
        id: version
        run: |
          VERSION=$(date +"%Y.%m.%d.%H%M%S")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Build Applications
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LDFLAGS="-s -w -X 'github.com/sametcn99/golter/internal/version.Current=$VERSION'"
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/golter-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/golter-windows-amd64.exe .
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/golter-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/golter-darwin-arm64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: bin/*
          draft: false
          prerelease: false
          generate_release_notes: true
