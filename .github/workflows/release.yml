name: Test and release

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  check-pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/native.yml
    with:
      version: pr-${{ github.event.number }}

  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: draft
        name: Prepare a draft for this commit
        shell: bash
        run: |
          timestamp=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          version=$(date -u -d "$timestamp" +%Y.%m.%d.%H%M%S)
          tag=v$version
          if gh release view "$tag" --json isDraft,targetCommitish > existing.json; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' existing.json
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Release $tag" --generate-notes
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    permissions:
      contents: write
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.draft.outputs.version }}
      upload: true

  release:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.draft.outputs.version }}
    steps:
      - name: Verify assets and publish
        shell: bash
        run: |
          gh release view "$TAG" --json isDraft,targetCommitish,assets | jq -e --arg sha "$GITHUB_SHA" '
            .isDraft and .targetCommitish == $sha and
            all(.assets[]; .size > 0 and .state == "uploaded") and
            ([.assets[].name] | sort) == [
              "golter-darwin-amd64", "golter-darwin-arm64", "golter-linux-amd64",
              "golter-windows-amd64.exe", "linux-test-evidence.tar.gz"
            ]'
          gh release edit "$TAG" --draft=false --latest
